# application.yml 로 복사해서 사용 (비밀값은 환경변수로 주입 권장)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none            # 스키마는 Flyway(db/migration)가 관리
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate:
        format_sql: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true          # 협업: 나중에 병합된 "더 낮은 버전" 마이그레이션도 적용
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


server:
  forward-headers-strategy: framework   # 프록시/LB 뒤에서 실제 클라이언트 IP 사용

app:
  # 공용(common/security): 모든 feature 가 공유
  security:
    jwt:
      secret: ${JWT_SECRET}             # 32바이트 이상의 랜덤 문자열
      access-token-ttl: 15m
    allowed-origins:
      - http://localhost:3000

  # auth feature 전용
  auth:
    refresh-token-ttl: 14d
    email-verification-ttl: 24h
    email-resend-cooldown: 60s
    password-reset-ttl: 30m
    signup-token-ttl: 30m
    max-login-attempts: 5
    lock-duration: 15m
    require-email-verified-for-login: false
    frontend-base-url: http://localhost:3000
    mail-from: no-reply@example.com
