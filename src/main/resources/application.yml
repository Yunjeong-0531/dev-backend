# application.yml 로 복사해서 사용 (비밀값은 환경변수로 주입 권장)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway(db/migration)가 관리
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate:
        format_sql: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true  # 협업: 나중에 병합된 "더 낮은 버전" 마이그레이션도 적용
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


server:
  forward-headers-strategy: framework   # 프록시/LB 뒤에서 실제 클라이언트 IP 사용

app:
  # 공용(common/security): 모든 feature 가 공유
  security:
    jwt:
      secret: ${JWT_SECRET}             # 32바이트 이상의 랜덤 문자열
      access-token-ttl: 15m
    allowed-origins:
      - http://localhost:3000

  # auth feature 전용
  auth:
    refresh-token-ttl: 14d
    email-verification-ttl: 24h
    email-resend-cooldown: 60s
    password-reset-ttl: 30m
    signup-token-ttl: 30m
    max-login-attempts: 5
    lock-duration: 15m
    require-email-verified-for-login: false
    frontend-base-url: http://localhost:3000
    mail-from: spring@green.com
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}   # 최초 관리자 지정용 (비우면 사용 안 함)

    # 소셜 로그인 (인가 코드 방식). client-secret 은 서버에만 둔다. 제공자 콘솔의 Redirect URI 는
    # {frontend-base-url}/auth/callback/kakao | naver | google 로 등록한다.
    social:
      allow-access-token: true              # 개발용(토큰 직접 입력 화면). 운영에서는 false
      kakao:
        client-id: ${KAKAO_CLIENT_ID:}      # REST API 키
        client-secret: ${KAKAO_CLIENT_SECRET:}
      naver:
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}