# application.yml 로 복사해서 사용 (비밀값은 환경변수로 주입 권장)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none            # 스키마는 auth_schema.sql 기준
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate:
        format_sql: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


server:
  forward-headers-strategy: framework   # 프록시/LB 뒤에서 실제 클라이언트 IP 사용

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}             # 32바이트 이상의 랜덤 문자열
      access-token-ttl: 15m
    refresh-token-ttl: 14d
    email-verification-ttl: 24h
    email-resend-cooldown: 60s
    password-reset-ttl: 30m
    signup-token-ttl: 30m
    max-login-attempts: 5
    lock-duration: 15m
    require-email-verified-for-login: false
    frontend-base-url: http://localhost:3000
    mail-from: no-reply@example.com
    allowed-origins:
      - http://localhost:3000
